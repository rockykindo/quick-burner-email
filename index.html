<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickBurner - Temp Email Generator</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        .custom-cursor:focus { caret-color: #818cf8; }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-5xl bg-gray-800 rounded-xl shadow-2xl p-6 border border-gray-700 flex flex-col gap-6">
        
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-gray-700 pb-4">
            <div>
                <h1 class="text-2xl font-bold text-indigo-400">🔥 QuickBurner</h1>
                <p class="text-gray-400 text-xs mt-0.5">Minimalist disposable email engine.</p>
            </div>
            
            <div class="flex flex-wrap items-center gap-2">
                <select id="domain-select" onchange="changeDomain()" 
                        class="bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-xs font-medium text-indigo-300 focus:outline-none focus:border-indigo-500 cursor-pointer">
                </select>
                
                <div class="flex rounded-lg bg-gray-900 border border-gray-700 overflow-hidden">
                    <input type="text" id="email-address" oninput="this.value = currentEmail" onclick="this.select()"
                           class="bg-transparent px-3 py-2 text-sm font-mono text-indigo-300 focus:outline-none w-48 sm:w-64 text-center custom-cursor" value="Generating..." readonly>
                    <button onclick="copyToClipboard()" id="copy-btn" class="bg-gray-700 hover:bg-gray-600 px-3 text-xs font-semibold tracking-wide transition cursor-pointer border-l border-gray-700">Copy</button>
                </div>

                <button onclick="generateNewEmail()" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold px-4 py-2 rounded-lg transition cursor-pointer">New</button>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-5 gap-6 min-h-[400px]">
            
            <div class="md:col-span-2 flex flex-col gap-3">
                <div class="flex justify-between items-center px-1">
                    <h2 class="text-sm font-bold tracking-wider uppercase text-gray-400">Inbox (Max 5)</h2>
                    <span id="status" class="text-[10px] bg-green-950/80 text-green-400 border border-green-900/50 px-2 py-0.5 rounded-full animate-pulse">Live</span>
                </div>
                
                <div id="inbox-container" class="space-y-2 flex-1 overflow-y-auto">
                    <p class="text-gray-500 text-xs text-center py-12">Listening for incoming verification links...</p>
                </div>
            </div>

            <div class="md:col-span-3 bg-gray-900/40 border border-gray-700/70 rounded-xl p-5 flex flex-col" id="reading-pane">
                <div class="flex flex-col items-center justify-center text-center h-full text-gray-500 py-12" id="pane-placeholder">
                    <span class="text-3xl mb-2">✉️</span>
                    <p class="text-xs">Select an email from the left feed to inspect content details directly inside this view window.</p>
                </div>
                
                <div id="pane-content" class="hidden flex-col h-full">
                    <div class="border-b border-gray-700 pb-3 mb-4">
                        <h3 id="view-subject" class="text-lg font-bold text-indigo-300 mb-1">...</h3>
                        <p id="view-from" class="text-xs text-gray-400">...</p>
                    </div>
                    <div id="view-body" class="flex-1 text-xs text-gray-300 overflow-y-auto pr-1 leading-relaxed"></div>
                </div>
            </div>

        </div>
    </div>

    <script>
        let currentEmail = "";
        let emailUser = ""; 
        let sid = ""; 
        let pollInterval;
        let activeMailId = null;

        // Ultimate resilient proxy stack with premium public fallbacks
        async function fetchWithProxy(url) {
            // Target 1: ScraperBox CORS proxy (Extremely stable)
            try {
                const proxy1 = `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`;
                const res = await fetch(proxy1);
                if (!res.ok) throw new Error("AllOrigins failed");
                const data = await res.json();
                return JSON.parse(data.contents);
            } catch (err1) {
                console.warn("AllOrigins choked, trying Codetabs...", err1);
                
                // Target 2: Codetabs CORS proxy (Great alternative fallback)
                try {
                    const proxy2 = `https://api.codetabs.com/v1/proxy/?quest=${encodeURIComponent(url)}`;
                    const res = await fetch(proxy2);
                    if (!res.ok) throw new Error("Codetabs failed");
                    return await res.json();
                } catch (err2) {
                    console.warn("Codetabs choked, trying Corsproxy.io...", err2);
                    
                    // Target 3: Corsproxy.io (Final safety net)
                    try {
                        const proxy3 = `https://api.corsproxy.io/?url=${encodeURIComponent(url)}`;
                        const res = await fetch(proxy3);
                        if (!res.ok) throw new Error("Corsproxy failed");
                        return await res.json();
                    } catch (err3) {
                        console.error("All public proxies in the stack have failed.", err3);
                        throw err3;
                    }
                }
            }
        }

        async function generateNewEmail() {
            clearInterval(pollInterval);
            resetCopyButton();
            clearReadingPane();
            document.getElementById('email-address').value = "Generating...";
            document.getElementById('inbox-container').innerHTML = '<p class="text-gray-500 text-xs text-center py-12">Listening for incoming verification links...</p>';
            
            try {
                const data = await fetchWithProxy('https://api.guerrillamail.com/ajax.php?f=get_email_address');
                sid = data.sid; 
                emailUser = data.email_user; 
                
                const domainData = await fetchWithProxy(`https://api.guerrillamail.com/ajax.php?f=get_domain_list&sid=${sid}`);
                const activeDomains = domainData.list || ['sharklasers.com', 'guerrillamailblock.com'];
                
                const dropdown = document.getElementById('domain-select');
                dropdown.innerHTML = ""; 
                
                activeDomains.forEach(domain => {
                    const option = document.createElement('option');
                    option.value = domain;
                    option.innerText = `@${domain}`;
                    dropdown.appendChild(option);
                });
                
                const selectedDomain = dropdown.value;
                updateEmailDisplay(selectedDomain);
                
                checkInbox();
                pollInterval = setInterval(checkInbox, 5000);
            } catch (err) {
